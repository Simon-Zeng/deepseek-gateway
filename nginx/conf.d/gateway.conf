upstream gateway {
    server gateway:8000;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name llm.gorobotic.cn;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name llm.gorobotic.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SSE/Streaming optimizations - CRITICAL for AI model streaming
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Disable request body size limit for large contexts
    client_max_body_size 50m;

    # Gzip is bad for SSE - disable it
    gzip off;

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-specific headers
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;

        # Disable response buffering (critical for streaming)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check doesn't need streaming settings
    location /health {
        proxy_pass http://gateway;
    }
}
