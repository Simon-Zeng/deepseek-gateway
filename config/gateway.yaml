server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout_keep_alive: 75

deepseek:
  base_url: "https://api.deepseek.com/v1"
  timeout: 300
  max_retries: 2
  retry_delay: 1.0
  connection_pool_size: 100

logging:
  level: info
  format: json
  log_requests: true
  log_responses: false
  log_streaming_chunks: false
